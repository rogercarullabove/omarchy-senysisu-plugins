# senysisu.plymouth: run the senysisu-plymouth clock hook right after the
# plymouth hook, before the encrypt hook stops for the disk password. Sorted
# after Omarchy's drop-ins so it sees their final HOOKS.
# Installed by senysisu.plymouth/install.sh.
_senysisu_hooks=()
for _senysisu_hook in "${HOOKS[@]}"; do
  _senysisu_hooks+=("$_senysisu_hook")
  [[ $_senysisu_hook == plymouth ]] && _senysisu_hooks+=(senysisu-plymouth)
done
HOOKS=("${_senysisu_hooks[@]}")
unset _senysisu_hooks _senysisu_hook
